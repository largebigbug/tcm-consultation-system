# M3 规则模型元文件 - m3-rule-model.yaml
# 依据《中医问诊系统-需求规格说明书-V9.md》2.3.3 规则表 + 附录 C.3
# 归属边界：属性级规则（REF-01/02/04/06/08/09/10/12/13）在 M1 属性 refRules，
#           同聚合多属性规则（REF-03/05/07/11/14）与聚合不变量（INV-01～INV-04）在 M1 invariants；
#           本文件只承载跨对象、跨行为或需被多个行为复用的规则（R-01～R-06）。
model_type: RULE
version: "2.0"
domain: "中医问诊"

rules:
  # ══════════════════════════════════════════════════════════
  # R-01 剂量超常用量上限的处理（处方明细 × 中药饮片）
  # ══════════════════════════════════════════════════════════
  - id: RULE-PRESCRIPTION-DOSE-LIMIT-CHECK
    name: 剂量超常用量上限处理判定
    ruleType: VALIDATION
    description: |-
      读取处方明细的单剂剂量与所引饮片的常用量区间，判定三种处理结论：
      PASS（未超常用上限，正常放行）/ NEED_REASON（超常用上限但在 2 倍以内，必须填写超量理由并强制药师审核）/
      BLOCK（超过常用上限 2 倍，直接阻断提交）。依据 D-11、D-16。
    inputParams:
      - name: singleDose
        type: Decimal
        sourceField: PrescriptionItem.singleDose
        required: true
        description: 处方明细单剂剂量（g）
      - name: maxCommonDose
        type: Decimal
        sourceField: Herb.maxCommonDose
        required: true
        description: 饮片常用最大量（g）
      - name: minCommonDose
        type: Decimal
        sourceField: Herb.minCommonDose
        required: true
        description: 饮片常用最小量（g）
      - name: overDoseReason
        type: String
        sourceField: PrescriptionItem.overDoseReason
        required: false
        description: 超量理由，超常用上限时必填
    outputType: String
    expression: |-
      IF singleDose <= maxCommonDose THEN 'PASS'
      ELSE IF singleDose > maxCommonDose * 2 THEN 'BLOCK'
      ELSE IF overDoseReason IS NULL OR LENGTH(overDoseReason) == 0 THEN 'NEED_REASON'
      ELSE 'NEED_REASON'
    reusedBy:
      - Prescription_Save
      - Prescription_Submit
    version: "1.0"

  # ══════════════════════════════════════════════════════════
  # R-02 库存不足阻断调剂（处方明细 × 中药饮片库存）
  # ══════════════════════════════════════════════════════════
  - id: RULE-HERB-STOCK-SUFFICIENT
    name: 饮片库存充足校验
    ruleType: VALIDATION
    description: 按处方剂数计算各味饮片需求总量，逐味比对饮片当前库存数量，任一味不足则阻断调剂（D-14）。
    inputParams:
      - name: requiredQuantity
        type: Decimal
        sourceField: PrescriptionItem.singleDose * Prescription.doses
        required: true
        description: 该味饮片需求总量 = 单剂剂量 × 剂数（g）
      - name: stockQuantity
        type: Decimal
        sourceField: Herb.stockQuantity
        required: true
        description: 饮片当前库存数量（g）
    outputType: Boolean
    expression: |-
      FOR EACH item IN prescriptionItems:
        IF item.singleDose * prescription.doses > herb(item.herbId).stockQuantity THEN RETURN false
      RETURN true
    reusedBy:
      - Dispense_Confirm
    version: "1.0"

  # ══════════════════════════════════════════════════════════
  # R-03 毒性饮片单张处方总量上限（处方明细汇总 × 中药饮片）
  # ══════════════════════════════════════════════════════════
  - id: RULE-HERB-TOXIC-TOTAL-LIMIT-CHECK
    name: 毒性饮片处方总量上限校验
    ruleType: VALIDATION
    description: |-
      对处方内毒性分级非「无毒」的饮片，按单剂剂量汇总同味饮片总量，与饮片维护的「毒性单张处方总量上限」比对，
      超上限即阻断提交；未维护上限的毒性饮片只做强制审核提示。依据 D-11。
    inputParams:
      - name: herbId
        type: String
        sourceField: PrescriptionItem.herbId
        required: true
      - name: toxicityLevel
        type: String
        sourceField: Herb.toxicityLevel
        required: true
        description: 毒性分级字典值，NONE 表示无毒
      - name: toxicDoseLimit
        type: Decimal
        sourceField: Herb.toxicDoseLimit
        required: false
        description: 毒性单张处方总量上限（g），为空表示不单独设限
      - name: totalDoseInPrescription
        type: Decimal
        sourceField: SUM(PrescriptionItem.singleDose)
        required: true
        description: 同一处方内该味饮片的单剂总量（g）
    outputType: Boolean
    expression: |-
      IF toxicityLevel == 'NONE' THEN RETURN true
      IF toxicDoseLimit IS NULL THEN RETURN true
      RETURN totalDoseInPrescription <= toxicDoseLimit
    reusedBy:
      - Prescription_Submit
    version: "1.0"

  # ══════════════════════════════════════════════════════════
  # R-04 处方作废的处理判定与阻断（处方 × 调剂发药记录）
  # ══════════════════════════════════════════════════════════
  - id: RULE-PRESCRIPTION-VOID-DISPATCH
    name: 处方作废处理判定与阻断
    ruleType: VALIDATION
    description: |-
      按调剂发药记录状态三分派：无记录或「待调剂」→ VOID_ONLY（允许作废，无库存动作，同步取消待调剂记录）；
      「已调剂」→ VOID_WITH_ROLLBACK（允许作废并按 B-02 回冲库存）；「已发药」→ BLOCK（阻断作废，
      退药走线下处理）。规则只判断与分派，状态变化由行为完成。依据 D-08、D-19。
    inputParams:
      - name: recordStatus
        type: String
        sourceField: DispenseRecord.recordStatus
        required: false
        description: 调剂发药记录状态；无记录时为空
      - name: prescriptionStatus
        type: String
        sourceField: Prescription.prescriptionStatus
        required: true
        description: 当前处方状态
    outputType: String
    expression: |-
      IF recordStatus IS NULL THEN RETURN 'VOID_ONLY'
      IF recordStatus == 'PENDING' THEN RETURN 'VOID_ONLY'
      IF recordStatus == 'DISPENSED' THEN RETURN 'VOID_WITH_ROLLBACK'
      IF recordStatus == 'ISSUED' THEN RETURN 'BLOCK'
      RETURN 'VOID_ONLY'
    reusedBy:
      - Prescription_Cancel
    version: "1.0"

  # ══════════════════════════════════════════════════════════
  # R-05 复诊日期顺序校验（复诊随访记录 × 上次就诊）
  # ══════════════════════════════════════════════════════════
  - id: RULE-FOLLOWUP-DATE-ORDER
    name: 复诊日期顺序校验
    ruleType: VALIDATION
    description: 实际随访日期不得早于随访来源就诊的挂号时间；违反时提示并要求修正（D-17）。
    inputParams:
      - name: actualFollowUpDate
        type: Date
        sourceField: FollowUp.actualFollowUpDate
        required: true
      - name: sourceVisitRegisterTime
        type: DateTime
        sourceField: Visit.registerTime
        required: true
        description: 上次就诊（随访来源）的挂号时间
    outputType: Boolean
    expression: |-
      actualFollowUpDate >= DATE(sourceVisitRegisterTime)
    reusedBy:
      - FollowUp_Complete
    version: "1.0"

  # ══════════════════════════════════════════════════════════
  # R-06 饮片库存对账校验（中药饮片库存 × 出入库流水）
  # ══════════════════════════════════════════════════════════
  - id: RULE-HERB-STOCK-RECONCILE
    name: 饮片库存对账校验
    ruleType: VALIDATION
    description: |-
      盘点时以饮片库存数量与全部出入库流水数量净和比对，输出对账结论与差异值（不阻断业务，供盘点人员据以发起盘点调整）。
      与 M1 聚合不变量 INV-03 同源：INV-03 为写入时强制的聚合不变量，本规则为盘点行为的对账判定与差异呈现。依据 INV-03。
    inputParams:
      - name: stockQuantity
        type: Decimal
        sourceField: Herb.stockQuantity
        required: true
      - name: flowNetQuantity
        type: Decimal
        sourceField: SUM(HerbStockFlow.quantity)
        required: true
        description: 该饮片全部出入库流水数量净和（g）
    outputType: Decimal
    expression: |-
      stockQuantity - flowNetQuantity
    reusedBy:
      - Herb_Stocktake
    version: "1.0"

# ══════════════════════════════════════════════════════════════════════════════
# 建模边界说明
# ══════════════════════════════════════════════════════════════════════════════
# 1. 系统管理模块不进本模型
#    需求文档 D.3 菜单树包含 7 个一级菜单，其中「系统管理」及其二级菜单
#    UI-20 用户管理、UI-21 角色与权限配置、UI-22 菜单管理，属于技术底座内置的
#    系统管理模块（对应平台功能 FUNC-17）。平台功能不进 M1/M2 本体模型
#    （M2 行为模型中无对应用户/角色/菜单维护行为，M5 主体模型中 ROLE-06
#    系统管理员的权限集合为空），故本 MU UI 模型不建立这三屏对应的屏幕、
#    界面元素与操作功能点，菜单树中亦不出现「系统管理」一级菜单。
#    本模型菜单树一级菜单为 6 个、二级菜单 19 个、屏幕 19 个，与建模范围一致。
#
# 2. 无 M2 行为入口的界面元素（仅作元素，不设操作功能点）
#    - 「清空」（UI-02）、「返回 / 返回待诊队列 / 返回队列」（UI-03、UI-05～UI-09）、
#      「四诊摘要」（UI-04）、「取消 / 关闭弹窗」（UI-10、UI-11、UI-12、UI-17）、
#      「重置」（各查询屏）：纯界面导航或条件重置动作，不改变业务状态；
#    - 「检查剂量」（UI-06）：调用 R-01 剂量上限判定规则，规则只判断不改变状态；
#    - 「对账检查」（UI-09）：调用 R-06 库存对账规则。
#
# 3. 「导出」功能点的处理
#    需求文档 D.6 为各查询屏列出了「导出」，但 M2 行为模型中未定义导出行为；
#    按需求文档第六部分 6.4「查询报表访问权限绑定唯一 Q 行为，导出权限随对应 Q 行为
#    一并授予」，本模型将「导出」操作功能点的 behaviorRef 指向该屏的查询行为，
#    与 D.6「导出 → 对应 Q 行为」的映射一致，不新增 M2 行为。
#
# 4. 「盘点」与「作废」弹窗
#    UI-10 的行操作「盘点」与 UI-17 的行操作「作废」均通过弹出对话框完成录入
#    （分别调用 Herb_Stocktake 与 Prescription_Cancel），布局图中已画出弹窗草图；
#    这两种界面类型为 QUERY_LIST，主区仍遵循「查询条件一行三个控件 + 结果表格分页」。
#
# 5. 控件类型与需求原型的差异（以 §8.3 强制映射为准）
#    M1 将接诊医师 doctorId、调剂人 dispenserId、复核人 checkerId、审核人 reviewerId、
#    操作人 operatorId、开方医师 doctorId 定义为 String 标量，将饮片规格 spec 定义为 String，
#    故这些控件使用 TEXTBOX，而原型（D.5）以跳选框 / 下拉框示意；控件类型以本体框架
#    §8.3 的强制映射为准，语义（可选择对象或字典项）由实现阶段的数据源提供。
#
# 6. 已知缺口（如实登记，未自行编造）
#    a) 原型 UI-04「脉象-六部脉」（左寸/左关/左尺/右寸/右关/右尺）在 M1 就诊记录
#       「四诊信息」子实体中无对应属性，本模型并入 pulseDetail（脉象补充说明）；
#    b) 原型 UI-11 列表的查询按钮在 D.6 中归属 FUNC-13（命令行为，无法作查询入口），
#       本模型以 Q-07 行为 FollowUp_QueryCompletion 作为该列表的查询入口；
#    c) M2 与 M7 中未定义「随访登记列表」与「证型字典列表」等单聚合列表的查询对象，
#       按 §7.2「单聚合简单查询可独立定义，不要求 M7」，相应 GRID 不设 dataSource；
#    d) UI-05 的从表「辨证结论」为独立聚合（AGG-DIAGNOSIS-001），非就诊聚合内子实体，
#       故该 GRID 不设 dataBinding，行集按 diagnosis.visitId 关联加载；
#    e) 【已修复】M2 Prescription_Cancel 的后置条件原写「prescription.remark 追加作废原因」，
#       而 M1 处方聚合（AGG-PRESCRIPTION-001）未定义 remark 属性（字段级不一致）。已改为
#       prescription.cancelReason，并在 M1 补 cancelReason（作废原因）属性、需求文档 OBJ-08
#       同步补该属性（文档 v1.3）；本模型 UI-17 的「作废原因」元素已绑定
#       Prescription.cancelReason，缺口关闭；
#    f) M1 处方聚合无「已退还 / 退药」相关属性与行为，UI-17 行操作「作废」在处方状态为
#       「已发药」时由 R-04 阻断（退药走线下），与本模型一致。

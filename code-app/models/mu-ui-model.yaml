  # ════════════════════════════════════════════════════════════════════════════
  # UI-17 就诊与处方记录查询（QUERY_LIST 主从）
  # 行为：Q-04 → Visit_QueryVisitAndPrescription（dataSource REP-04 / QR-VISIT-PRESCRIPTION-001）；
  #       行操作「作废」→ FUNC-09 → Prescription_Cancel（弹窗填写作废原因）
  # ════════════════════════════════════════════════════════════════════════════
  - screenId: frmVisitPrescriptionQuery
    name: 就诊与处方记录查询
    screenType: QUERY_LIST
    layout: |
      ┌──────────────────────────────────────────────────────────────────────────┐
      │ 中医问诊系统 / 统计报表 / 就诊与处方记录查询                              │
      ├──────────────────────────────────────────────────────────────────────────┤
      │          患者姓名: [txtQryPatientName]  就诊号: [txtQryVisitNo]  处方号: [txtQryPrescriptionNo] │
      │          挂号日期: {dtpQryDateFrom} ~ {dtpQryDateTo}   就诊状态: (cboQryVisitStatus) │
      │          处方状态: (cboQryPrescriptionStatus)  接诊医师: [txtQryDoctorId]  审核药师: [txtQryReviewerId] │
      │          [btnQuery 查询] [btnReset 重置] [btnExport 导出]                  │
      ├──────────────────────────────────────────────────────────────────────────┤
      │ 主表：就诊记录                                                            │
      │ @grdVisitResult                                                           │
      │  就诊号 | 患者 | 性别 | 年龄 | 就诊类型 | 挂号时间 | 接诊医师 | 就诊状态 | [展开] │
      │   └ 从表：处方（行「展开」后呈现）                                          │
      │ @grdPrescriptionResult                                                    │
      │     处方号 | 处方状态 | 剂数 | 用法 | 开方时间 | 审核人 | [作废]            │
      │ 分页: [lblPaging 共N条] [cboPageSize 每页20条] [btnPrev 上一页] [btnNext 下一页] │
      │ 行操作「作废」打开下方弹窗（FUNC-09；已发药由 R-04 阻断）                    │
      └──────────────────────────────────────────────────────────────────────────┘

      （行操作「作废」弹出对话框，页面本身不展示以下表单）
      ┌──────────────────────────────────────────────────────────────────────────┐
      │ 处方作废                                                                  │
      │          处方号: [txtVoidPrescriptionNo 只读]                              │
      │          作废原因: [txaVoidReason]                                        │
      │                                             [btnVoid 作废] [btnVoidCancel 取消] │
      └──────────────────────────────────────────────────────────────────────────┘
    elements:
      - id: txtQryPatientName
        type: TEXTBOX
        label: 患者姓名
        io: I
        dataBinding: Patient.patientName
      - id: txtQryVisitNo
        type: TEXTBOX
        label: 就诊号
        io: I
        dataBinding: Visit.visitNo
      - id: txtQryPrescriptionNo
        type: TEXTBOX
        label: 处方号
        io: I
        dataBinding: Prescription.prescriptionNo
      - id: dtpQryDateFrom
        type: DATEPICKER
        label: 挂号日期从
        io: I
        dataBinding: Visit.registerTime
      - id: dtpQryDateTo
        type: DATEPICKER
        label: 挂号日期到
        io: I
        dataBinding: Visit.registerTime
      - id: cboQryVisitStatus
        type: COMBO
        label: 就诊状态
        io: I
        dataBinding: Visit.visitStatus
      - id: cboQryPrescriptionStatus
        type: COMBO
        label: 处方状态
        io: I
        dataBinding: Prescription.prescriptionStatus
      - id: txtQryDoctorId
        type: TEXTBOX
        label: 接诊医师
        io: I
        dataBinding: Visit.doctorId
      - id: txtQryReviewerId
        type: TEXTBOX
        label: 审核药师
        io: I
        dataBinding: Prescription.reviewerId
      - id: grdVisitResult
        type: GRID
        label: 就诊记录（主表）
        io: O
        dataSource: QR-VISIT-PRESCRIPTION-001
      - id: grdPrescriptionResult
        type: GRID
        label: 处方记录（从表）
        io: O
        dataSource: QR-VISIT-PRESCRIPTION-001
        # 主从同源：主表行为就诊记录，从表为主表行「展开」后由同一次 Q-04 查询返回的处方与明细层级
      - id: lblPaging
        type: LABEL
        label: 分页信息
        io: O
      - id: cboPageSize
        type: COMBO
        label: 每页条数
        io: I
      - id: btnPrev
        type: BUTTON
        label: 上一页
      - id: btnNext
        type: BUTTON
        label: 下一页
      - id: txtVoidPrescriptionNo
        type: TEXTBOX
        label: 处方号
        io: O
        required: true
        dataBinding: Prescription.prescriptionNo
      - id: txaVoidReason
        type: TEXTAREA
        label: 作废原因
        io: I
        dataBinding: Prescription.cancelReason
        # 对应 M2 Prescription_Cancel 的后置条件 prescription.cancelReason
        # （M1 处方聚合已补 cancelReason 属性，原 remark 缺口已消除）
      - id: btnVoid
        type: BUTTON
        label: 作废
      - id: btnVoidCancel
        type: BUTTON
        label: 取消
        # 关闭弹窗，不调用 M2 行为
      - id: btnQuery
        type: BUTTON
        label: 查询
      - id: btnReset
        type: BUTTON
        label: 重置
      - id: btnExport
        type: BUTTON
        label: 导出
    actions:
      - actionId: actQuery
        name: 查询
        actionType: BUTTON
        behaviorRef: Visit_QueryVisitAndPrescription
        permissionRef: [PERM-QUERY-VISIT-PRESCRIPTION]
      - actionId: actExport
        name: 导出
        actionType: BUTTON
        behaviorRef: Visit_QueryVisitAndPrescription
        permissionRef: [PERM-QUERY-VISIT-PRESCRIPTION]
      - actionId: actVoid
        name: 作废
        actionType: BUTTON
        behaviorRef: Prescription_Cancel
        permissionRef: [PERM-PRESCRIPTION-CANCEL]
        # 按 R-04 三分派执行：无记录/待调剂→仅作废并取消待调剂记录；已调剂→作废并回冲库存；
        # 已发药→阻断作废（退药走线下）

  # ════════════════════════════════════════════════════════════════════════════
  # UI-18 超量·毒性处方审核台账（QUERY_LIST）
  # 行为：Q-06 → Prescription_QueryOverdoseReview（dataSource REP-06 / QR-PRESCRIPTION-OVERDOSE-001）
  # ════════════════════════════════════════════════════════════════════════════
  - screenId: frmOverdoseLedger
    name: 超量·毒性处方审核台账
    screenType: QUERY_LIST
    layout: |
      ┌──────────────────────────────────────────────────────────────────────────┐
      │ 中医问诊系统 / 统计报表 / 超量·毒性处方审核台账                            │
      ├──────────────────────────────────────────────────────────────────────────┤
      │          开方日期: {dtpQryDateFrom} ~ {dtpQryDateTo}   触发类型: (cboQryTriggerType) │
      │          处方状态: (cboQryPrescriptionStatus)  审核药师: [txtQryReviewerId]  处理结果: (cboQryHandleResult) │
      │          [btnQuery 查询] [btnReset 重置] [btnExport 导出]                  │
      ├──────────────────────────────────────────────────────────────────────────┤
      │ @grdResult                                                                │
      │  处方号 | 患者 | 开方日期 | 开方医师 | 超量/毒性药味 | 剂量 | 上限 | 超出倍数 | 毒性 | 超量理由 | 处方状态 | 审核人 │
      │ 分页: [lblPaging 共N条] [cboPageSize 每页20条] [btnPrev 上一页] [btnNext 下一页] │
      └──────────────────────────────────────────────────────────────────────────┘
    elements:
      - id: dtpQryDateFrom
        type: DATEPICKER
        label: 开方日期从
        io: I
        dataBinding: Prescription.prescribeTime
      - id: dtpQryDateTo
        type: DATEPICKER
        label: 开方日期到
        io: I
        dataBinding: Prescription.prescribeTime
      - id: cboQryTriggerType
        type: COMBO
        label: 触发类型
        io: I
        # 派生条件（超量 / 毒性 / 两者），无对应 M1 属性，故不设 dataBinding
      - id: cboQryPrescriptionStatus
        type: COMBO
        label: 处方状态
        io: I
        dataBinding: Prescription.prescriptionStatus
      - id: txtQryReviewerId
        type: TEXTBOX
        label: 审核药师
        io: I
        dataBinding: Prescription.reviewerId
      - id: cboQryHandleResult
        type: COMBO
        label: 处理结果
        io: I
        # 派生条件（审核通过 / 已驳回），无对应 M1 属性，故不设 dataBinding
      - id: grdResult
        type: GRID
        label: 超量·毒性处方审核台账
        io: O
        dataSource: QR-PRESCRIPTION-OVERDOSE-001
      - id: lblPaging
        type: LABEL
        label: 分页信息
        io: O
      - id: cboPageSize
        type: COMBO
        label: 每页条数
        io: I
      - id: btnPrev
        type: BUTTON
        label: 上一页
      - id: btnNext
        type: BUTTON
        label: 下一页
      - id: btnQuery
        type: BUTTON
        label: 查询
      - id: btnReset
        type: BUTTON
        label: 重置
      - id: btnExport
        type: BUTTON
        label: 导出
    actions:
      - actionId: actQuery
        name: 查询
        actionType: BUTTON
        behaviorRef: Prescription_QueryOverdoseReview
        permissionRef: [PERM-QUERY-OVERDOSE-REVIEW]
      - actionId: actExport
        name: 导出
        actionType: BUTTON
        behaviorRef: Prescription_QueryOverdoseReview
        permissionRef: [PERM-QUERY-OVERDOSE-REVIEW]


# ══════════════════════════════════════════════════════════
# 建模边界说明
# ══════════════════════════════════════════════════════════
# 1. 用户（接诊医师、开方医师、审核人、调剂人、复核人、操作人）：平台内置对象，由系统管理功能（FUNC-17）
#    与 M5 主体模型承载，M1 中以 String 存储平台用户 ID，不进领域对象清单（保持 OBJ-01～OBJ-12 完整）。
# 2. 科室：单机构固定范围，建模为 DICT-VISIT.DEPT 数据字典，不单列聚合。
# 3. 子实体不单独设为聚合：OBJ-03 四诊信息隶属就诊记录聚合；OBJ-09 处方明细隶属处方聚合；
#    OBJ-10 饮片出入库记录隶属中药饮片聚合（cascadeDelete=false，只追加）；
#    方剂模板组成明细隶属方剂模板聚合（D-12：内嵌明细，不单独编号）。

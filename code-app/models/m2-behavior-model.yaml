  # ══════════════════════════════════════════════════════════
  # 系统自动行为（B-01～B-06，由 ROLE-07 承载，经 syncTriggers 同步调用）
  # ══════════════════════════════════════════════════════════
  - id: Visit_Complete
    name: 就诊状态收尾
    ownerEntity: AGG-VISIT-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    description: 对应 B-04；处方提交送审成功后由 Prescription_Submit 同步触发，就诊置「已完成」
    preconditions:
      - "visit.visitStatus == '接诊中'"
      - "存在已提交成功的处方"
    postconditions:
      - field: visit.visitStatus
        setValue: "已完成"
    appliedRules: []
    requiredPermissions:
      - PERM-AUTO-VISIT-COMPLETE
    syncTriggers:
      - behaviorRef: FollowUp_CreatePlan
        description: 就诊完成后同步生成复诊随访记录（无条件联动）

  - id: FollowUp_CreatePlan
    name: 复诊提醒生成
    ownerEntity: AGG-FOLLOWUP-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    description: 对应 B-03；就诊完成后生成待随访记录，计划随访日期 = 就诊日 + 剂数 × 1 天（D-17）
    preconditions:
      - "就诊状态为「已完成」"
      - "该次就诊存在提交成功的处方"
    postconditions:
      - field: followUp.followUpNo
        setValue: "系统生成"
      - field: followUp.recordStatus
        setValue: "待随访"
      - field: followUp.plannedFollowUpDate
        setValue: "就诊日期 + 剂数 × 1 天（按用法折算）"
    appliedRules: []
    requiredPermissions:
      - PERM-AUTO-FOLLOWUP-PLAN
    syncTriggers: []

  - id: Herb_DeductStock
    name: 饮片库存扣减
    ownerEntity: AGG-HERB-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    description: |-
      对应 B-01；确认调剂时经 R-02 校验通过后同步执行，
      按单剂剂量 × 剂数扣减各味饮片库存并追加调剂出库流水（同一聚合、同一事务）
    preconditions:
      - "R-02 判定库存充足"
      - "扣减后库存不为负（REF-08）"
    postconditions:
      - field: herb.stockQuantity
        setValue: "stockQuantity - 单剂剂量 × 剂数"
      - field: herb.HerbStockFlow
        setValue: "逐味追加业务类型为「调剂出库」的流水（数量为负）"
    appliedRules:
      - RULE-HERB-STOCK-SUFFICIENT
    requiredPermissions:
      - PERM-AUTO-STOCK-DEDUCT
    syncTriggers: []

  - id: Herb_ReturnStock
    name: 饮片库存回冲
    ownerEntity: AGG-HERB-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    description: |-
      对应 B-02；处方作废经 R-04 判定为「已调剂」分支时同步执行，
      按原出库量回冲库存并追加作废回冲流水
    preconditions:
      - "R-04 判定结果为 VOID_WITH_ROLLBACK"
      - "对应调剂出库流水存在"
    postconditions:
      - field: herb.stockQuantity
        setValue: "stockQuantity + 原出库数量"
      - field: herb.HerbStockFlow
        setValue: "逐味追加业务类型为「作废回冲」的流水（数量为正）"
    appliedRules:
      - RULE-PRESCRIPTION-VOID-DISPATCH
    requiredPermissions:
      - PERM-AUTO-STOCK-RETURN
    syncTriggers: []

  - id: Dispense_CreatePending
    name: 创建待调剂记录
    ownerEntity: AGG-DISPENSE-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    description: |-
      对应 B-05（建模补全）；处方审核通过后由审批流「通过」分支调用，
      生成该处方的调剂发药记录（状态「待调剂」），成为药剂师调剂入口
    preconditions:
      - "prescription.prescriptionStatus == '审核通过'"
      - "该处方不存在调剂发药记录（一对一约束）"
    postconditions:
      - field: dispenseRecord.dispenseNo
        setValue: "系统生成"
      - field: dispenseRecord.recordStatus
        setValue: "待调剂"
    appliedRules: []
    requiredPermissions:
      - PERM-AUTO-DISPENSE-CREATE
    syncTriggers: []

  - id: Dispense_CancelPending
    name: 取消待调剂记录
    ownerEntity: AGG-DISPENSE-001
    behaviorType: COMMAND
    triggerType: SYSTEM
    description: |-
      对应 B-06（建模补全）；处方作废经 R-04 判定为「无记录/待调剂」分支时同步执行，
      取消该处方的待调剂记录（已发药记录不可取消）
    preconditions:
      - "R-04 判定结果为 VOID_ONLY"
      - "dispenseRecord.recordStatus == '待调剂'"
      - "处方状态已为「已作废」"
    postconditions:
      - field: dispenseRecord.recordStatus
        setValue: "已取消"
    appliedRules:
      - RULE-PRESCRIPTION-VOID-DISPATCH
    requiredPermissions:
      - PERM-AUTO-DISPENSE-CANCEL
    syncTriggers: []
